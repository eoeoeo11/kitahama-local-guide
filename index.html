<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OSAKA GOURMET GUIDE</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f5f1;color:#222;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP","Yu Gothic",sans-serif}
.wrap{max-width:720px;margin:auto;padding:28px 18px 44px}
header{background:#222;color:#fff;border-radius:20px;padding:30px 24px;margin-bottom:18px}
.kicker{font-size:12px;letter-spacing:.18em;opacity:.72;margin-bottom:8px}
h1{font-size:30px;margin:0 0 8px;letter-spacing:.02em}
.sub{font-size:14px;line-height:1.7;opacity:.88}
.note{background:#fff;border:1px solid #e6e0d8;border-radius:16px;padding:15px 17px;margin:0 0 16px;font-size:13px;line-height:1.7}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid #e7e2db;border-radius:15px;padding:16px 14px;text-decoration:none;color:#222;min-height:64px;box-shadow:0 2px 8px rgba(0,0,0,.035)}
.icon{font-size:23px;width:28px;text-align:center}
.card span:nth-child(2){font-size:15px;font-weight:600;flex:1}
.arrow{font-size:24px;color:#aaa}
footer{text-align:center;font-size:11px;color:#888;margin-top:24px}
@media(max-width:520px){.grid{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
